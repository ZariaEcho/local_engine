[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-engine"
version = "0.3.1"
description = "A local repository-aware Context Engine powered by Claude CLI workers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.9",
  "PyYAML>=6.0",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
local-engine = "local_engine.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "unit: fast tests that avoid subprocess-heavy CLI runs",
  "integration: slower end-to-end CLI/runtime checks",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
include = ["local_engine*"]

[tool.setuptools.package-data]
"local_engine.resources" = [
  "agents/*.yaml",
  "intents/*.yaml",
  "task_templates/*.yaml",
  "skills/*/*.yaml",
  "skills/*/*.md",
]
