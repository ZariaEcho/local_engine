workers: 4
executors:
  claude:
    command:
      - claude
    enabled: true
claude_command:
  - claude
timeout_seconds: 300
model_commands:
  claude:
    - claude
execution:
  max_retries: 2
  default_executor: claude
  fallback_executor:
  fallback_model:
  fallback_prompt: true
  continue_on_failure: true
  timeout_multiplier: 1.5
review:
  enabled: true
  reviewer_agent: reviewer
  review_skill: review_code
  threshold: 0.75
  max_rounds: 2
  risky_task_types: [backend, frontend, refactor]
  risky_tags: [code_change, architecture, security]
quality:
  min_body_characters: 80
  max_body_characters: 12000
  low_confidence_threshold: 0.5
hooks:
  enabled: true
loop:
  enabled: false
  max_rounds: 2
  review_required_for: [deliverable, code_patch]
  stop_on: [repeated_failure, unsafe_patch, missing_context]
telemetry:
  enabled: false
  mode: local_only
  anonymize: true
  collect: [version, command_type, run_status, task_count, duration, error_type]
# Context quality is intentionally non-blocking. It is derived from the project
# scan and persisted under each run's artifacts/ directory.
