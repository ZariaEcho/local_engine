name: data_analyst
task_type: data_analysis
description: Analyze repository evidence into architecture findings and risks.
inputs: [repo_context, user_requirement]
outputs: [analysis]
default_agent: data_analyst
cache: {watched_paths: ['**/*.py', '**/*.ts', '**/*.tsx', '**/*.js', '**/*.go', '**/*.rs', '**/*.java', pyproject.toml, package.json, requirements.txt, go.mod, Cargo.toml, pom.xml]}
