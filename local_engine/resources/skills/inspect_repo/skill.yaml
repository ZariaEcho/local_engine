name: inspect_repo
task_type: scan
description: Inspect repository structure, conventions, dependencies, and relevant code paths.
inputs: [repo_context, user_requirement]
outputs: [repository_inspection]
default_agent: reviewer
priority: 10
cache: {watched_paths: ['**/*.py', '**/*.ts', '**/*.tsx', '**/*.js', '**/*.go', '**/*.rs', '**/*.java', '**/*.yaml', '**/*.yml', '**/*.json', '**/*.md']}
