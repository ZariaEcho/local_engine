name: audit_repo
task_type: analyze
description: Audit repository architecture, risks, and missing pieces.
inputs: [repo_context, user_requirement]
outputs: [audit_report]
default_agent: reviewer
review_required: true
priority: 10
cache: {watched_paths: ['**/*.py', '**/*.ts', '**/*.tsx', '**/*.js', '**/*.go', '**/*.rs', '**/*.java', pyproject.toml, package.json, requirements.txt, go.mod, Cargo.toml, pom.xml]}
