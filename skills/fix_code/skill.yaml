name: fix_code
task_type: refactor
description: Diagnose and repair a scoped code issue.
inputs: [repo_context, user_requirement]
outputs: [patch]
default_agent: backend
review_required: true
cache: {watched_paths: ['**/*.py', '**/*.ts', '**/*.tsx', '**/*.js', '**/*.go', '**/*.rs', '**/*.java', pyproject.toml, package.json]}
